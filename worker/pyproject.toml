[project]
name = "memoryvault-worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.49,<3.0.0",
    "numpy>=2.4.4,<3.0.0",
    "scikit-learn>=1.8.0,<2.0.0",
    "sentence-transformers>=2.2.0,<4.0.0",
    "whisperx",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
