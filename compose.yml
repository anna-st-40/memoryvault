services:
  backend:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        # To enable GPU: https://download.pytorch.org/whl/cu124
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    volumes:
      # Do not edit the next line. To change the media location, edit MEDIA_DIR in the .env file
      - ${MEDIA_DIR}:/data
      - ./thumbnails:/app/thumbnails
      - ./database:/app/database
    environment:
      MEMORYVAULT_BASE: /data
      THUMBNAILS_DIR: /app/thumbnails
      DATABASE_URL: sqlite:////app/database/app.db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

  frontend:
    restart: unless-stopped
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      PUBLIC_API_URL: http://localhost:8000
    ports:
      - "8765:3000"
