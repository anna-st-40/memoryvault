[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryvault"
version = "0.1.0"
description = "A small Typer-based command-line interface for MemoryVault."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1",
]

[project.scripts]
memoryvault = "memoryvault.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
